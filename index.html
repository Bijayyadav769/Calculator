<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>
        <input type="text" class="text" placeholder="0" readonly id="display">

    <div class="buttons">
        <button id="btnAC">AC</button>
        <button id="btnDEL">DEL</button>
        <button id="btnPERCENT">%</button>
        <button id="btnDIVIDE">/</button>

        <button id="btn7">7</button>
        <button id="btn8">8</button>
        <button id="btn9">9</button>
        <button id="btnMULTIPLY">*</button>

        <button id="btn4">4</button>
        <button id="btn5">5</button>
        <button id="btn6">6</button>
        <button id="btnSUBTRACT">-</button>

        <button id="btn1">1</button>
        <button id="btn2">2</button>
        <button id="btn3">3</button>
        <button id="btnADD">+</button>

        <button id="btn0">0</button>
        <button id="btn00">00</button>
        <button id="btnDECIMAL">.</button>
        <button id="btnEQUAL">=</button>
        </div>
    </div>
       
    
    
</body>
<script src="app.js"></script>
</html>
